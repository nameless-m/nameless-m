<svg xmlns="http://www.w3.org/2000/svg" width="420" height="130" viewBox="0 0 420 130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #141a22; }
    .border { fill: none; stroke: #2f3b4c; stroke-width: 1.5; animation: pulse 5s ease-in-out infinite; }
    .accent { fill: #cfd8e8; }
    .title { font: 700 20px 'Fira Code', 'SF Mono', Consolas, monospace; fill: #cfd8e8; }
    .desc { font: 400 13px 'Fira Code', 'SF Mono', Consolas, monospace; fill: #d8dae0; }
    .tag { font: 400 11px 'Fira Code', 'SF Mono', Consolas, monospace; fill: #5a6b82; }
    .tagbox { fill: none; stroke: #2f3b4c; }
    .spark { animation: flash 5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 55%, 100% { stroke: #2f3b4c; }
      60% { stroke: #cfd8e8; }
      65% { stroke: #2f3b4c; }
      70% { stroke: #a5aebf; }
      80% { stroke: #2f3b4c; }
    }
    @keyframes flash {
      0%, 55%, 100% { opacity: .4; }
      60% { opacity: 1; }
      65% { opacity: .5; }
      70% { opacity: 1; }
      80% { opacity: .4; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="416" height="126" rx="12"/>
  <rect class="border" x="2" y="2" width="416" height="126" rx="12"/>
  <polygon class="accent spark" points="31,18 21,32 27,32 24,44 36,29 30,29"/>
  <text class="title" x="48" y="38">Urbano+</text>
  <!-- EDITE A DESCRICAO ABAIXO -->
  <text class="desc" x="24" y="68">Descrição curta do que o projeto faz.</text>
  <text class="desc" x="24" y="88">Segunda linha, se precisar.</text>
  <!-- EDITE AS TAGS ABAIXO -->
  <rect class="tagbox" x="24" y="100" width="48" height="18" rx="9"/>
  <text class="tag" x="34" y="113">Java</text>
  <rect class="tagbox" x="80" y="100" width="62" height="18" rx="9"/>
  <text class="tag" x="90" y="113">Spring</text>
</svg>
