<svg xmlns="http://www.w3.org/2000/svg" width="900" height="32" viewBox="0 0 900 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { stroke: #2f3b4c; stroke-width: 1; }
    .glow { stroke: #cfd8e8; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 120 780; animation: slide 4s ease-in-out infinite; opacity: .55; }
    .bolt { fill: #cfd8e8; animation: flash 4s ease-in-out infinite; transform-origin: 450px 16px; }
    @keyframes slide { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: -780; } }
    @keyframes flash {
      0%, 55%, 100% { opacity: .35; }
      60% { opacity: 1; }
      65% { opacity: .4; }
      70% { opacity: 1; }
      80% { opacity: .35; }
    }
  </style>
  <line class="line" x1="40" y1="16" x2="420" y2="16"/>
  <line class="line" x1="480" y1="16" x2="860" y2="16"/>
  <line class="glow" x1="40" y1="16" x2="860" y2="16"/>
  <polygon class="bolt" points="454,3 442,18 449,18 445,29 460,13 452,13"/>
</svg>
